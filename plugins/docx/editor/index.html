<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Word Document Viewer</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:12px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--orca-foreground, #171717);background:var(--orca-background, white)}[hidden]{display:none!important}.app{height:100%;display:flex;flex-direction:column}.content{position:relative;flex:1;min-height:0}.viewport{width:100%;height:100%;overflow:auto;scrollbar-gutter:stable;background:var(--orca-muted, #f5f5f5)}.pages{min-width:100%;contain:layout style paint!important;isolation:isolate!important}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:var(--orca-muted-foreground, #737373);background:var(--orca-background, white);z-index:2}.footer{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:5px 12px;border-top:1px solid var(--orca-border, #e5e5e5);background:var(--orca-background, white);color:var(--orca-muted-foreground, #737373)}button{color:inherit;background:transparent;border:0;border-radius:4px;font:inherit;height:28px;min-width:28px;padding:4px 7px;cursor:pointer}button:hover:enabled{background:var(--orca-accent, #e5e5e5);color:var(--orca-foreground, #171717)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--orca-ring, #737373);outline-offset:1px}.percent{width:44px;font-variant-numeric:tabular-nums}.label{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-count{margin-left:auto;white-space:nowrap}.link-bar{position:relative;z-index:3;display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--orca-border, #e5e5e5);background:var(--orca-background, white)}.link-bar label{white-space:nowrap;color:var(--orca-muted-foreground, #737373)}.link-bar input{flex:1;min-width:0;font:inherit;color:var(--orca-foreground, #171717);background:var(--orca-muted, #f5f5f5);b </head>
<body>
<style id="fonts"></style>
<div class="app">
<div class="find-bar" id="find-bar" role="search" hidden><input id="find" type="text" placeholder="Find in document" aria-label="Find in document" autocomplete="off" spellcheck="false"><span id="find-count" class="find-count" aria-live="polite"></span><button id="find-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button><button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">↓</button><button id="close-find" type="button" title="Close (Escape)" aria-label="Close find">×</button></div>
<div class="content">
<div class="viewport" id="viewport" tabindex="0" aria-label="Word document preview"><div class="pages" id="pages"></div></div>
<div class="message" id="message" role="status"></div>
</div>
<div class="link-bar" id="link-bar" hidden><label for="link" id="link-label">Copy link address</label><input id="link" readonly aria-label="Link address"><button id="close-link" type="button" aria-label="Close link address">×</button></div>
<div class="footer">
<button id="out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
<button id="fit" type="button" title="Fit to width" aria-label="Fit to width">Fit</button>
<button id="in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
<span id="percent" class="percent">100%</span>
<button id="open-find" type="button" title="Find in document" aria-label="Find in document">Find</button>
<button id="markup" type="button" title="Show tracked changes and comments" aria-label="Show tracked changes and comments" hidden>Markup</button>
<span class="label">Word document · Read only</span>
<span id="count" class="page-count" aria-live="polite"></span>
</div>
</div>
